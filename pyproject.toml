[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f2f"
version = "0.1.0"
description = "Face-to-face contact networks: characterisation, spreading, calibration and interventions"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "networkx>=3.2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyarrow>=12",
]

[tool.setuptools.packages.find]
where = ["src"]
